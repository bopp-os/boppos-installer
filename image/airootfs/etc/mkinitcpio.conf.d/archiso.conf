# No kms hook: it copies every GPU driver and its firmware (amdgpu, i915/xe, NVIDIA GSP, radeon) into the initramfs,
# where the already-compressed firmware does not shrink and sits next to the same files in the squashfs. Plymouth
# draws on simpledrm (built into the kernel) until switch-root; the GPU drivers load from the squashfs after that, and
# the installer's sway waits for them (etc/profile.d/zz-boppos-installer.sh).
HOOKS=(base udev plymouth microcode modconf archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
