# The installer's kiosk session: sway shows one window and squeekboard, the on-screen keyboard that comes up when a
# text field gets focus (touch-only machines such as the Legion Go have no keyboard). The window is tiled, not
# fullscreen, so it shrinks when the keyboard appears instead of being covered by it.
default_border none
default_floating_border none
focus_follows_mouse no
font pango:sans 10
seat * hide_cursor 0

xwayland disable
exec squeekboard
exec /usr/local/bin/boppos-orient
exec sh -c 'bootc-installer; swaymsg exit'
